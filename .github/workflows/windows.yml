name: windows-build
on:
  push:
    branches:
      - '**'
    # Version tags are fully built and tested by windows-proxy-release.
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Publish
      - name: Update WebView2 Evergreen Runtime
        shell: pwsh
        run: ./scripts/Update-WebView2Runtime.ps1
      - name: Native WebView2 graphics regression
        env:
          ALLMAIL_PROTON_LIVE_CHECK: '1'
          ALLMAIL_MIN_WEBVIEW2_MAJOR: '154'
        timeout-minutes: 8
        shell: pwsh
        run: |
          dotnet run --project tests/ProtonProfiles.WebView2.Smoke -c Release 2>&1 | Tee-Object -FilePath artifacts/test-results/webview2-graphics.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify per-user installer
        shell: pwsh
        run: |
          ./scripts/Build-Installer.ps1
          [xml]$props = Get-Content Directory.Build.props
          ./scripts/Test-Installer.ps1 -Installer "artifacts/release/SecureBrowser-$($props.Project.PropertyGroup.Version)-setup-win-x64.exe" 2>&1 | Tee-Object artifacts/test-results/installer.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proton-profiles-${{ github.sha }}
          path: |
            artifacts/publish-core
            artifacts/publish-experimental
            artifacts/test-results
            artifacts/release/*.exe
            artifacts/release/*.sha256
