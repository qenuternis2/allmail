          Native document defaults smoke: nondefault media/fonts/text scale positive controls; main/child, loaded/initial frames; local font rendering fallback while font presence remains visible; see webview2-graphics.log
          Native additional fingerprint smoke: baseline enabled APIs and Slow-2G control; strict APIs/permissions and fixed 4G estimates, main/child, loaded/initial frames and dedicated startup; strict service workers stopped/bypassed; see webview2-graphics.log
          Native timezone smoke: root-only leak negative controls; production RuntimeDefault/StrictFingerprint, main/child, first script in same/cross-origin frames and dedicated worker, winter/summer offsets and native Date/Intl; see webview2-graphics.log
          Script WebCodecs smoke: positive controls for eight constructors; RuntimeDefault/StrictFingerprint, main/child, first script in forced OOP iframe and dedicated worker; native HTML media and local PCM WAV decoding retained; see webview2-graphics.log
