name: windows-proxy-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: proxy-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, test and publish Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag such as v0.1.1.' }
          [xml]$props = Get-Content Directory.Build.props
          if ($props.Project.PropertyGroup.Version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Release tag does not match the configured application version.' }
          ./build.ps1 -Publish
      - name: Native WebView2 graphics regression
        env:
          ALLMAIL_PROTON_LIVE_CHECK: '1'
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet run --project tests/ProtonProfiles.WebView2.Smoke -c Release 2>&1 | Tee-Object -FilePath artifacts/test-results/webview2-graphics.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package experimental HTTP proxy build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_TAG.Substring(1)
          $binaryVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'artifacts/publish-experimental/ProtonProfiles.ExperimentalProxy.exe'))
          if ($binaryVersion.ProductVersion.Split('+')[0] -ne $version -or $binaryVersion.FileVersion -ne "$version.0") { throw 'Published EXE version does not match release tag.' }
          $name = "AllMails-$version-proxy-win-x64"
          $releaseDirectory = Join-Path $PWD 'artifacts/release'
          $bundle = Join-Path $releaseDirectory $name
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item 'artifacts/publish-experimental/*' $bundle -Recurse
          Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in '.pdb', '.xml' } | Remove-Item
          Copy-Item 'WEBRTC_FIX_REPORT.md' $bundle
          Copy-Item 'FINGERPRINT_FIX_REPORT.md' $bundle
          Copy-Item 'FINGERPRINT_DEFAULTS_RESEARCH.md' $bundle
          Copy-Item 'THIRD-PARTY-GEOIP.txt' $bundle
          Copy-Item 'artifacts/test-results/webview2-graphics.log' $bundle
          @"
          All Mails $version — экспериментальная поддержка HTTP-прокси

          Windows 11 x64. Распакуйте весь архив и запустите ProtonProfiles.ExperimentalProxy.exe.
          Не переносите EXE отдельно от DLL и остальных папок. .NET включён в комплект.
          Нужен Microsoft Edge WebView2 Runtime (Evergreen):
          https://developer.microsoft.com/microsoft-edge/webview2/

          В настройках профиля выберите HTTP-прокси и укажите http://узел:порт.
          Поддерживается Basic-аутентификация; SOCKS5 не поддерживается.
          Изменения прокси и WebRTC требуют полного перезапуска профиля.
          Доступ страниц к WebRTC по умолчанию блокируется; сетевое ограничение UDP выбирается отдельно.
          Отсутствие прямого трафика и IP-утечек не подтверждено.
          Графический режим проверен в локальном Windows WebView2 стенде CI.
          Реальные маршруты WebView2 и интерфейс приложения целиком не проверены.
          Подробности и границы защиты: WEBRTC_FIX_REPORT.md.

          Кнопка «Создать» открывает одну форму профиля: название, метка и любой HTTP/HTTPS URL.
          Начальный URL, прокси и защита задаются до открытия сайта.
          В 0.1.39: вкладки внутри каждого профиля; адресная строка, назад/вперёд, обновить/остановить, сайт профиля.
          + / Ctrl+T — новая вкладка, Ctrl+L — адрес, Ctrl+W — закрыть, Ctrl+Tab — переключить.
          Новые окна сайтов открываются во вкладках той же сессии, с тем же прокси, часовым поясом и защитой.
          Последняя вкладка закрывает профиль; после перезапуска открывается начальный URL. Вкладки не восстанавливаются.
          Исправлено применение аппаратных разрешений к именованному профилю; закрытие соседней вкладки сохраняет запреты.
          В настройках можно экспериментально отключить WebGL/WebGPU; это может нарушить 3D.
          Режим отключает ускорение GPU и программный 3D-резерв; интерфейс и видео могут стать медленнее.
          Режим «WebGL/WebGPU + Canvas» сохраняет рисование, но блокирует чтение/экспорт изображений.
          Экспорт изображений, редакторы и некоторые проверки сайтов могут перестать работать.
          В 0.1.8: «Защита отпечатка → WebGL/WebGPU + Canvas + Web Audio» дополнительно блокирует AudioContext/OfflineAudioContext в документах.
          Web Audio эффекты и визуализаторы могут перестать работать. Изменение требует полного перезапуска профиля.
          HTML audio/video API остаются доступны; покрытие всех контекстов и способов аудиоотпечатка не подтверждено.
          CPU/RAM, экран, шрифты и Math остаются видимыми. Подробнее: FINGERPRINT_FIX_REPORT.md.
          В 0.1.9: «Графика/Canvas/Audio + DPR 1» задаёт базовый масштаб устройства 1 общим флагом Chromium.
          Размер окна сохраняется. Масштаб браузера учитывается отдельно; изменение требует перезапуска в этом режиме.
          Размеры экрана пересчитываются движком; фиксированное разрешение не задаётся. DPI может проявляться через другие API; полное покрытие не подтверждено.
          В 0.1.10: «Графика/Canvas/Audio/DPR + без речи» дополнительно отключает Speech Synthesis нативным флагом Blink.
          Список голосов ОС и озвучка текста сайтами через этот API становятся недоступны. Выберите режим вручную и полностью перезапустите профиль.
          Отчёт v7 проверяет отсутствие Speech Synthesis отдельно; естественное отсутствие Window API в worker отмечается NotApplicable.
          В 0.1.11: «Предыдущая защита + без UA Client Hints» дополнительно ограничивает раскрытие точных сборок браузера и версии ОС.
          Нативный CDP ограничивает метаданные UA в странице и связанных контекстах до запуска скриптов. Штатный User-Agent сохраняется. Для нового режима нужен UA «По умолчанию»; UA «Свой» отклоняется до открытия сайта из-за рассогласования в ServiceWorker. JavaScript API не подменяются.
          SharedWorker отключён нативно в этом режиме; некоторые сайты могут перестать работать. Старые режимы его сохраняют.
          Изменение требует полного перезапуска профиля; перед целевым URL результат проверяется в локальной HTTPS-странице.
          Поведение зависит от Runtime; некоторые сайты могут неправильно определять браузер. Отчёт разделяет документ, worker и HTTP echo; пустой echo не подтверждает удаление заголовков.
          В 0.1.13: «Предыдущая защита + без Local Font Access» дополнительно отключает queryLocalFonts и FontData нативно.
          CSS/Canvas-определение установленных шрифтов остаётся доступным; редакторы с выбором локальных шрифтов могут перестать работать.
          Нужен UA «По умолчанию» и полный перезапуск профиля. Отчёт v27 показывает applicationVersion, collectorHash и активный режим.
          Страница отдаётся из сборки без кэширования, несовместимый отчёт нельзя сохранить.
          В 0.1.14: «Предыдущая защита + округление CPU» нативно округляет hardwareConcurrency вниз до 1/2/4/8, сохраняя getter.
          Нужен штатный UA и полный перезапуск профиля. Физический CPU, benchmarks, RAM и CSS-шрифты остаются доступными.
          В 0.1.15: «Предыдущая защита + без аппаратных API» нативно отключает Bluetooth, USB, HID и Serial.
          Сайты для подключения устройств перестанут работать. Нужен штатный UA и полный перезапуск профиля.
          RAM, экран, CSS-шрифты и медиаустройства остаются видимыми; полный охват не подтверждён.
          В 0.1.16: «Предыдущая защита + без API нагрузки CPU» нативно отключает Compute Pressure.
          Нужен штатный UA и полный перезапуск. Адаптация сайта к нагрузке может перестать работать; обычные CPU benchmarks остаются доступны.
          В 0.1.17: «Строгая защита API и оценки сети» добавляет отключение WebXR, cpuPerformance, API измерения памяти, захвата экрана, выбора аудиовыхода, дополнительных сенсоров и NFC.
          Камера, микрофон, геолокация, датчики, MIDI, определение простоя и дополнительные экраны запрещены нативными разрешениями для всех origin внутри среды профиля. Перезапуск и штатный UA обязательны.
          Оценки navigator.connection стандартизованы как 4G; это не ограничение скорости, не измерение реального канала и не проверка маршрутов прокси.
          В 0.1.18: строгий режим также стандартизует CSS-предпочтения, generic-шрифты, размеры 16/13 и масштаб текста ОС 1.
          Отрисовка local(...) ограничена; FontFace.load и явные имена установленных шрифтов остаются доступны. Шрифты в workers не скрыты.
          Экран, CSS-шрифты, Math, HTML/MSE codecs и timing остаются видимыми. Отчёт v27 содержит отдельный список оставшихся источников.
          В 0.1.20: новая иконка, без постоянного жёлтого баннера; GET-запросы сборщика без Referer и имени приложения в Origin.
          В 0.1.19: нативные размеры экрана сохраняются согласованными; фиксированный экран не охватывает OOP iframe в WebView2.
          RAM bucket 8 задаётся скриптом. Скриптом также закрываются Battery/Gamepad, mediaDevices/MediaCapabilities, оставшиеся датчики, IdleDetector, getScreenDetails, performance.memory и storage.estimate.
          Изменения JavaScript обнаружимы. При установке в dedicated workers первый скрипт приостанавливается до проверки; ошибки подготовки блокируют профиль.
          ServiceWorker API закрыт; targets останавливаются, сохранённые workers обходятся нативно. Офлайн-режим и часть фоновых функций могут перестать работать. Регистрации не удаляются.
          Создание FontFace(local) запрещено; URL и binary fonts доступны. Явные CSS/DOM-шрифты, Math, timing, codecs и размеры окна остаются видимыми.
          Строгий proxy режим убирает bypass loopback, выключает QUIC и запрещает локальное разрешение всех сайтов, кроме узла прокси; непроксированный WebRTC UDP ограничивается автоматически.
          Сайты для игр, устройств и оценки хранилища могут перестать работать. Нужен строгий режим, штатный UA и полный перезапуск профиля.
          IP и hostname в отчёте скрываются по умолчанию при сохранении.

          В 0.1.23: видимое название All Mails; отдельная кнопка тестового профиля удалена.
          Начальный URL задаётся при обычном создании и в настройках каждого профиля.
          Выбранный часовой пояс нативно применяется к связанным iframe/workers до запуска скриптов.
          Отчёт v18 сравнивает зимние/летние смещения Date и показывает точные расхождения iframe.
          В 0.1.24: строгий режим закрывает восемь WebCodecs entry points скриптом до первого скрипта документа/worker.
          HTML media и MSE сохраняются; локальный WAV декодируется без WebCodecs. Это обнаружимое ограничение, не нативная подмена.
          Отчёт v19 проверяет WebCodecs отдельно в документе, dedicated worker и двух iframe; codecs HTML/MSE остаются видимыми.
          В 0.1.38: строгий режим нативно задаёт continuous и отключает Viewport Segments.
          Сверяются Device Posture/Viewport API, CSS media, реальные CSS-правила и env() во фреймах.
          Windows-стенд включает folded/два сегмента и проверяет нативное ограничение и исключение рабочей области. HDR и физический экран остаются видимыми.
          В 0.1.37: огрублены Long Animation Frame/Script Timing, paint/presentation и Element Timing до 100 мс.
          Вложенные scripts в toJSON() огрубляются; mark.detail, нативный Web Crypto и планирование сохраняются.
          Нативный Windows-стенд создаёт настоящий длинный кадр до/после защиты и проверяет исключение точных часов.
          В 0.1.36: удалён публичный Symbol-маркер часов; огрубление проверяется явной Performance.mark меткой.
          Строгая защита закрывает request/cancelVideoFrameCallback, getVideoPlaybackQuality и webkit кадровые счётчики.
          Обычное HTML видео сохраняется; исключение «Точные часы, временные метки и видеостатистика» возвращает эти API.
          Отчёт v27 показывает видеотелеметрию отдельно; физический экран, DOM-шрифты и косвенные тайминги остаются доступны.
          В 0.1.35: автообновление Mailfud IPv4/IPv6 каждые 7 дней через системную сеть Windows (не прокси профиля).
          В настройках GeoIP включите «Автообновление Mailfud каждые 7 дней» или нажмите «Скачать Mailfud / обновить сейчас».
          Настройка общая, сохраняется сразу, по умолчанию выключена. Mailfud видит IP системного соединения.
          После ошибки повтор через сутки; закрытое приложение обновит базы при следующем запуске.
          Проверка обоих файлов, одинаковой даты и атомарная замена; прежняя база сохраняется при ошибке.
          Ручной импорт отключает расписание. Открытым профилям нужен перезапуск для нового пояса.
          В 0.1.34 добавлен импорт Mailfud Legacy GeoIP City (.dat / .dat.gz).
          Скачайте https://mailfud.org/geoip-legacy/GeoIPCity.dat.gz и GeoIPCityv6.dat.gz с той же страницы.
          В настройках выберите «Установить / обновить City базу…» и оба файла сразу: gzip распакуется автоматически.
          Legacy хранит координаты; IANA-пояс ищется по встроенной GeoTimeZone карте без сетевого GeoIP API.
          Для IPv6 нужна IPv6-база; старые MMDB поддерживаются. Реальные IP-базы в архив не включены.
          Native Legacy fixture: proxy Basic auth, Origin null/no Referer, first-script timezone в main/frames/worker, stopped proxy без прямого fallback.
          В 0.1.32 добавлен часовой пояс «Авто по IP» с локальной City MMDB.
          Скачайте GeoLite2 City/GeoIP2 City отдельно у MaxMind, распакуйте .mmdb,
          в настройках профиля нажмите «Установить / обновить City базу…» и выберите «Авто по IP».
          База общая; в архив не включена. IP определяется запросами к api.ipify.org/api6.ipify.org
          через сеть профиля; lookup локальный, пояс фиксируется до перезапуска.
          Если IP/пояс не найден или IPv4/IPv6 расходятся, сайт не открывается: обновите базу или задайте пояс вручную.
          Нативный стенд проверяет proxy Basic auth, Origin null/no Referer, timezone во фреймах/worker и отказ прокси без прямого fallback.
          В 0.1.31: старый HTTPS worker smoke передаёт все новые функции наблюдения; полное readback и native pow обязательны во всех контекстах. Формат отчёта v24 сохранён.
          В 0.1.30: прямые часы и временные метки огрубляются до 100 мс; рабочая область равна экрану, координаты окна 0; FontFaceSet.check закрыт; Math.pow использует эталонный V8 путь без JavaScript-замены. Независимые исключения для точных часов, реальной рабочей области и обычного Math.pow.
          Физическое разрешение, DOM-геометрия шрифтов, другие Math-функции и непрямые временные каналы остаются видимыми. WebView2 сохраняется, полный fingerprint не скрыт.
          В 0.1.29: Canvas measureText закрыт в строгом режиме в document/worker/iframe; рисование текста сохранено. Отдельное исключение CanvasTextMetrics возвращает нативные метрики; CSS/DOM-шрифты остаются видимыми.
          В 0.1.28 исправлена причина Unsupported browser Proton: защита WebCodecs/Keyboard сохраняет Object.prototype.constructor; исключения для этого не нужны.
          В 0.1.28: независимые исключения защиты каждого профиля; Web Crypto SHA-256/AES-GCM/tamper rejection в документе/worker/iframe; камера/микрофон требуют обычного подтверждения. Разрешённые SharedWorker: identity/script coverage NotPerformed; service workers: script coverage NotPerformed.
          В 0.1.27: Windows проверка отключённого proxy ожидает конкретную NavigationId до 45 секунд; тайм-аут ожидания события остаётся ошибкой, прямые запросы запрещены.
          В 0.1.26: строгий режим закрывает Keyboard Layout Map и Keyboard Lock скриптом до первого скрипта документа/iframe.
          Обычный ввод и события клавиатуры сохраняются; закрытие обнаружимо. Раскладка не запрашивается, искусственная карта не подставляется.
          Отчёт v27 проверяет шесть entry points отдельно; естественное отсутствие в worker — NotApplicable. ID среды v2 сохранён.
          В 0.1.25: кнопка «Группы…» создаёт, переименовывает и удаляет группы; «В группу…» перемещает выбранные профили (Ctrl/Shift для нескольких).
          Новый профиль можно сразу включить в группу. Фильтр показывает все профили, выбранную группу или профили без группы.
          Удаление группы сохраняет профили; изменение состава не перезапускает браузер. Стрелки сохраняют позиции скрытых профилей.
          Группы — локальная метаинформация; JSON-экспорт настроек профилей их не включает.
          Строгий режим нативно отключает Remote Playback и Presentation. Отчёт v20 проверяет эти API отдельно; HTML audio/video и MSE сохраняются.
          В 0.1.22: отчёт v17 сравнивает главный документ с локальными same-origin и cross-origin HTTPS iframe.
          Проверяются согласованность CPU/RAM/экрана/UA/часового пояса и ограничения API в каждом iframe.
          Добавлены запросы поддержки медиакодеков и короткая выборка performance.now в документе, worker и iframe.
          Медиа не загружается и не воспроизводится. Тайминги и новые разделы не входят в ID среды v2.
          collectorHash охватывает HTML отчёта, скрипт наблюдения и HTML iframe. Старый отчёт v16 отклоняется.
          Это расширение диагностики; кодеки, таймер, CSS-шрифты и размеры экрана не скрыты.
          Полное покрытие сайтов/процессов, реальные DNS/IPv6/WebRTC маршруты и независимая Accept-CH проверка по-прежнему не подтверждены отчётом.

          Часовой пояс задаётся в настройках профиля (IANA, например Europe/Berlin).
          Пустое поле сохраняет системный пояс; изменение требует перезапуска.
          Рекомендуется штатный User-Agent. Подробнее: FINGERPRINT_FIX_REPORT.md.

          Настройки обновляются до схемы v7 с резервной копией; UDF не удаляется.
          Для возврата к старому приложению понадобится предмиграционный backup metadata.
          "@ | Set-Content (Join-Path $bundle 'README-ru.txt') -Encoding utf8BOM
          $commit = git rev-parse HEAD
          @"
          Version: $version
          Commit: $commit
          Configuration: Release
          Runtime: win-x64
          SelfContained: true
          ExperimentalProxy: true
          Build and automated tests: Windows GitHub Actions
          Native graphics/Canvas/Speech Synthesis, document Web Audio and screen smoke: local HTTPS, main/child/dedicated worker, loaded frames, bundled report; see webview2-graphics.log
