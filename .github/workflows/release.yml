          Remaining WebView2 privacy smoke: 100ms Date/Performance/Event/Temporal clocks and native mark serialization in first main/same/forced-OOP/dedicated scripts, RAF/Intl callbacks, FontFaceSet.check closure, normalized work area, native V8 pow golden bits, independent exceptions; see webview2-graphics.log
          Script Canvas text metrics smoke: positive controls, actual measureText/readability and text drawing in first main/same/forced-OOP/dedicated scripts; per-profile metrics exception main/child; DOM fonts retained; see webview2-graphics.log
          Script Keyboard Layout smoke: positive control for six entry points, first script in main/same/cross/dedicated, RuntimeDefault/StrictFingerprint main/child, native KeyboardEvent and trusted browser text input/Enter retained; no layout requested; see webview2-graphics.log
          Profile groups: metadata schema v5 migration/backup, live profile preservation, assignment rollback, persistent empty groups and filtered reorder tested by Core tests
          Residual API smoke: RAM bucket 8 and script restrictions; debugger instrumentation before first dedicated worker script; strict service worker targets stopped and stored workers bypassed; window/frame guards; local FontFace construction denied; see webview2-graphics.log
          Proxy routing smoke: IPv4/IPv6 fixed proxies, HTTP loopback and unresolvable target hostname, HTTPS CONNECT, stopped proxy with zero direct receiver requests; see webview2-graphics.log
          Real-site internal headers: legacy header positive control, GET/POST cleanup in main/child; legitimate headers preserved; see webview2-graphics.log
          Diagnostic request headers: no-referrer, Origin removed for echo/ipinfo, neutral Origin retained for ipify CORS; real HTTP receiver and ordinary-site positive control; see webview2-graphics.log
          Profile privacy exceptions: metadata schema v7 migration/backup; 20 opt-in features, native main/child and worker startup fixtures; allowed SharedWorker identity/script and service-worker script coverage NotPerformed
          JavaScript intrinsics: Object/Array/Error/EventTarget remain intact in 80 native document/worker/frame observations; constructor aliases of blocked interfaces remain locked
          Web Crypto: native SHA-256, AES-GCM roundtrip and tamper rejection in 80 bundled document/worker/frame contexts; active page observed separately without account data
          Fingerprint collector: report v27, assembly-derived applicationVersion, embedded collectorHash, no-store serving, repeated old/new URL and stale report rejection; see webview2-graphics.log
          Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Profile tabs: production engine/WPF fixture; first-script privacy; shared cookies/storage and separate-profile isolation; popup/window.close; history; initial-tab and last-tab shutdown; unsafe URLs/stale generations rejected
          Native hardware permissions: runtime Default profile, retained private controller; first-script and post-close checks of 11 permissions; cold named Default migration with backups, persistent cookies/localStorage preserved
          Full manual GUI and WebView2 network acceptance: not performed
          "@ | Set-Content (Join-Path $bundle 'BUILD-INFO.txt') -Encoding utf8
          foreach ($file in 'ProtonProfiles.ExperimentalProxy.exe', 'WebView2Loader.dll', 'e_sqlite3.dll', 'coreclr.dll', 'hostfxr.dll', 'hostpolicy.dll') {
            if (!(Test-Path (Join-Path $bundle $file))) { throw "Missing dependency: $file" }
          }
          $config = Get-Content (Join-Path $bundle 'ProtonProfiles.ExperimentalProxy.runtimeconfig.json') -Raw | ConvertFrom-Json
          if ($config.runtimeOptions.framework -or $config.runtimeOptions.frameworks) { throw 'Expected a self-contained build.' }
          $archive = Join-Path $releaseDirectory "$name.zip"
          Compress-Archive -Path $bundle -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$archive.sha256" -Encoding ascii
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if (!$zip.GetEntry("$name/ProtonProfiles.ExperimentalProxy.exe")) { throw 'EXE missing from ZIP.' }
            Write-Host "Verified ZIP: $($zip.Entries.Count) entries; SHA256: $hash"
          } finally { $zip.Dispose() }
      - name: Upload archive and publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "artifacts/release/AllMails-$version-proxy-win-x64.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $notesPath = Join-Path $env:RUNNER_TEMP 'allmail-release-notes.md'
          @"
          All Mails $version с HTTP-прокси; отчёт v27. .NET включён, требуется WebView2 Runtime.
          В 0.1.39: каждый профиль имеет собственные вкладки и адресную строку для любых HTTP/HTTPS сайтов.
          + / Ctrl+T — новая вкладка; Ctrl+L — адрес; Ctrl+W — закрыть; Ctrl+Tab — переключить.
          Назад/вперёд, обновить/остановить, кнопка сайта профиля; новые окна сайтов открываются в той же сессии.
          Прокси, часовой пояс и защита общие внутри профиля. Последняя вкладка закрывает профиль.
          При следующем открытии — начальный URL; список вкладок не восстанавливается. Диагностика — активная вкладка.
          Исправлено применение аппаратных разрешений к именованному профилю; закрытие соседней вкладки сохраняет запреты.
          Production engine/WPF native fixture проверяет сессию, изоляцию, first-script защиту, popups и закрытие.

