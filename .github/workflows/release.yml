name: windows-proxy-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: proxy-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, test and publish Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag such as v0.1.1.' }
          [xml]$props = Get-Content Directory.Build.props
          if ($props.Project.PropertyGroup.Version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Release tag does not match the configured application version.' }
          ./build.ps1 -Publish
      - name: Native WebView2 graphics regression
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet run --project tests/ProtonProfiles.WebView2.Smoke -c Release 2>&1 | Tee-Object -FilePath artifacts/test-results/webview2-graphics.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package experimental HTTP proxy build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_TAG.Substring(1)
          $binaryVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'artifacts/publish-experimental/ProtonProfiles.ExperimentalProxy.exe'))
          if ($binaryVersion.ProductVersion.Split('+')[0] -ne $version -or $binaryVersion.FileVersion -ne "$version.0") { throw 'Published EXE version does not match release tag.' }
          $name = "ProtonProfiles-$version-proxy-win-x64"
          $releaseDirectory = Join-Path $PWD 'artifacts/release'
          $bundle = Join-Path $releaseDirectory $name
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item 'artifacts/publish-experimental/*' $bundle -Recurse
          Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in '.pdb', '.xml' } | Remove-Item
          Copy-Item 'WEBRTC_FIX_REPORT.md' $bundle
          Copy-Item 'FINGERPRINT_FIX_REPORT.md' $bundle
          Copy-Item 'artifacts/test-results/webview2-graphics.log' $bundle
          @"
          Proton Profiles $version — экспериментальная поддержка HTTP-прокси

          Windows 11 x64. Распакуйте весь архив и запустите ProtonProfiles.ExperimentalProxy.exe.
          Не переносите EXE отдельно от DLL и остальных папок. .NET включён в комплект.
          Нужен Microsoft Edge WebView2 Runtime (Evergreen):
          https://developer.microsoft.com/microsoft-edge/webview2/

          В настройках профиля выберите HTTP-прокси и укажите http://узел:порт.
          Поддерживается Basic-аутентификация; SOCKS5 не поддерживается.
          Изменения прокси и WebRTC требуют полного перезапуска профиля.
          Доступ страниц к WebRTC по умолчанию блокируется; сетевое ограничение UDP выбирается отдельно.
          Отсутствие прямого трафика и IP-утечек не подтверждено.
          Графический режим проверен в локальном Windows WebView2 стенде CI.
          Реальные маршруты WebView2 и интерфейс приложения целиком не проверены.
          Подробности и границы защиты: WEBRTC_FIX_REPORT.md.

          Кнопка «Тестовый профиль…» создаёт отдельный профиль с любым HTTP/HTTPS URL.
          Начальный URL, прокси и защита задаются до открытия сайта.
          В настройках можно экспериментально отключить WebGL/WebGPU; это может нарушить 3D.
          Режим отключает ускорение GPU и программный 3D-резерв; интерфейс и видео могут стать медленнее.
          Режим «WebGL/WebGPU + Canvas» сохраняет рисование, но блокирует чтение/экспорт изображений.
          Экспорт изображений, редакторы и некоторые проверки сайтов могут перестать работать.
          В 0.1.8: «Защита отпечатка → WebGL/WebGPU + Canvas + Web Audio» дополнительно блокирует AudioContext/OfflineAudioContext в документах.
          Web Audio эффекты и визуализаторы могут перестать работать. Изменение требует полного перезапуска профиля.
          HTML audio/video API остаются доступны; покрытие всех контекстов и способов аудиоотпечатка не подтверждено.
          CPU/RAM, экран, шрифты и Math остаются видимыми. Подробнее: FINGERPRINT_FIX_REPORT.md.
          В 0.1.9: «Графика/Canvas/Audio + DPR 1» задаёт базовый масштаб устройства 1 общим флагом Chromium.
          Размер окна сохраняется. Масштаб браузера учитывается отдельно; изменение требует перезапуска в этом режиме.
          Размеры экрана пересчитываются движком; фиксированное разрешение не задаётся. DPI может проявляться через другие API; полное покрытие не подтверждено.
          В 0.1.10: «Графика/Canvas/Audio/DPR + без речи» дополнительно отключает Speech Synthesis нативным флагом Blink.
          Список голосов ОС и озвучка текста сайтами через этот API становятся недоступны. Выберите режим вручную и полностью перезапустите профиль.
          Отчёт v7 проверяет отсутствие Speech Synthesis отдельно; естественное отсутствие Window API в worker отмечается NotApplicable.
          В 0.1.11: «Предыдущая защита + без UA Client Hints» дополнительно ограничивает раскрытие точных сборок браузера и версии ОС.
          Нативный CDP ограничивает метаданные UA в странице и связанных контекстах до запуска скриптов. Штатный User-Agent сохраняется. Для нового режима нужен UA «По умолчанию»; UA «Свой» отклоняется до открытия сайта из-за рассогласования в ServiceWorker. JavaScript API не подменяются.
          SharedWorker отключён нативно в этом режиме; некоторые сайты могут перестать работать. Старые режимы его сохраняют.
          Изменение требует полного перезапуска профиля; перед целевым URL результат проверяется в локальной HTTPS-странице.
          Поведение зависит от Runtime; некоторые сайты могут неправильно определять браузер. Отчёт разделяет документ, worker и HTTP echo; пустой echo не подтверждает удаление заголовков.
          В 0.1.12: «Предыдущая защита + без Local Font Access» дополнительно отключает queryLocalFonts и FontData нативно.
          CSS/Canvas-определение установленных шрифтов остаётся доступным; редакторы с выбором локальных шрифтов могут перестать работать.
          Нужен UA «По умолчанию» и полный перезапуск профиля. Отчёт v9 показывает applicationVersion, collectorHash и активный режим.
          Страница отдаётся из сборки без кэширования, несовместимый отчёт нельзя сохранить.
          IP и hostname в отчёте скрываются по умолчанию при сохранении.

          Часовой пояс задаётся в настройках профиля (IANA, например Europe/Berlin).
          Пустое поле сохраняет системный пояс; изменение требует перезапуска.
          Рекомендуется штатный User-Agent. Подробнее: FINGERPRINT_FIX_REPORT.md.

          Настройки обновляются до схемы v4 с резервной копией; UDF не удаляется.
          Для возврата к старому приложению понадобится предмиграционный backup metadata.
          "@ | Set-Content (Join-Path $bundle 'README-ru.txt') -Encoding utf8BOM
          $commit = git rev-parse HEAD
          @"
          Version: $version
          Commit: $commit
          Configuration: Release
          Runtime: win-x64
          SelfContained: true
          ExperimentalProxy: true
          Build and automated tests: Windows GitHub Actions
          Native graphics/Canvas/Speech Synthesis, document Web Audio and screen smoke: local HTTPS, main/child/dedicated worker, loaded frames, bundled report; see webview2-graphics.log
          Native UA Client Hints smoke: production HTTPS bootstrap, native UA preserved, custom UA rejected before navigation, loaded frames, dedicated/service worker startup, SharedWorker native absence and actual loopback Accept-CH HTTP receiver; see webview2-graphics.log
          Workflow run: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          GUI and WebView2 network acceptance: not performed
          "@ | Set-Content (Join-Path $bundle 'BUILD-INFO.txt') -Encoding utf8
          foreach ($file in 'ProtonProfiles.ExperimentalProxy.exe', 'WebView2Loader.dll', 'e_sqlite3.dll', 'coreclr.dll', 'hostfxr.dll', 'hostpolicy.dll') {
            if (!(Test-Path (Join-Path $bundle $file))) { throw "Missing dependency: $file" }
          }
          $config = Get-Content (Join-Path $bundle 'ProtonProfiles.ExperimentalProxy.runtimeconfig.json') -Raw | ConvertFrom-Json
          if ($config.runtimeOptions.framework -or $config.runtimeOptions.frameworks) { throw 'Expected a self-contained build.' }
          $archive = Join-Path $releaseDirectory "$name.zip"
          Compress-Archive -Path $bundle -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$archive.sha256" -Encoding ascii
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if (!$zip.GetEntry("$name/ProtonProfiles.ExperimentalProxy.exe")) { throw 'EXE missing from ZIP.' }
            Write-Host "Verified ZIP: $($zip.Entries.Count) entries; SHA256: $hash"
          } finally { $zip.Dispose() }
      - name: Upload archive and publish GitHub pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_TAG.Substring(1)
          $archive = "artifacts/release/ProtonProfiles-$version-proxy-win-x64.zip"
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" | ConvertFrom-Json
          $existing = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if (!$existing) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --title "$env:RELEASE_TAG — Windows x64, experimental HTTP proxy" --notes 'Self-contained Windows x64 build with experimental HTTP proxy support. See README-ru.txt and WEBRTC_FIX_REPORT.md inside the ZIP. GUI and actual network routes are not verified.'
          }
          gh release upload $env:RELEASE_TAG $archive "$archive.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-release-${{ inputs.tag || github.ref_name }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
            artifacts/test-results
