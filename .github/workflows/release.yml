          через сеть профиля; lookup локальный, пояс фиксируется до перезапуска.
          Если IP/пояс не найден или IPv4/IPv6 расходятся, сайт не открывается: обновите базу или задайте пояс вручную.
          Нативный стенд проверяет proxy Basic auth, Origin null/no Referer, timezone во фреймах/worker и отказ прокси без прямого fallback.
          В 0.1.31: старый HTTPS worker smoke передаёт все новые функции наблюдения; полное readback и native pow обязательны во всех контекстах. Формат отчёта v24 сохранён.
