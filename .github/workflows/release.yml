name: windows-proxy-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: proxy-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build, test and publish Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag such as v0.1.1.' }
          [xml]$props = Get-Content Directory.Build.props
          if ($props.Project.PropertyGroup.Version -ne $env:RELEASE_TAG.Substring(1)) { throw 'Release tag does not match the configured application version.' }
          ./build.ps1 -Publish
      - name: Update WebView2 Evergreen Runtime
        shell: pwsh
        run: ./scripts/Update-WebView2Runtime.ps1
      - name: Native WebView2 regression
        env:
          ALLMAIL_PROTON_LIVE_CHECK: '1'
          ALLMAIL_MIN_WEBVIEW2_MAJOR: '154'
        timeout-minutes: 8
        shell: pwsh
        run: |
          dotnet run --project tests/ProtonProfiles.WebView2.Smoke -c Release 2>&1 | Tee-Object -FilePath artifacts/test-results/webview2-graphics.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package and verify installer and archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:RELEASE_TAG.Substring(1)
          $binaryVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $PWD 'artifacts/publish-experimental/SecureBrowser.exe'))
          if ($binaryVersion.ProductVersion.Split('+')[0] -ne $version -or $binaryVersion.FileVersion -ne "$version.0") { throw 'Published EXE version does not match release tag.' }
          $name = "SecureBrowser-$version-proxy-win-x64"
          $releaseDirectory = Join-Path $PWD 'artifacts/release'
          $bundle = Join-Path $releaseDirectory $name
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item 'artifacts/publish-experimental/*' $bundle -Recurse
          Get-ChildItem $bundle -Recurse -File | Where-Object { $_.Extension -in '.pdb', '.xml' } | Remove-Item
          ./scripts/Sign-Release.ps1 -Path @("$bundle/SecureBrowser.exe", "$bundle/SecureBrowser.dll", "$bundle/SecureBrowser.Core.dll")
          Copy-Item README.md "$bundle/README.md"
          Copy-Item WEBRTC_FIX_REPORT.md,FINGERPRINT_FIX_REPORT.md,FINGERPRINT_DEFAULTS_RESEARCH.md,THIRD-PARTY-GEOIP.txt $bundle
          Copy-Item docs/acceptance-report-0.1.50.md "$bundle/ACCEPTANCE.md"
          Copy-Item docs/installing.md "$bundle/INSTALLING.md"
          Copy-Item artifacts/test-results/webview2-graphics.log $bundle
          Copy-Item artifacts/test-results/modern-main.png "$bundle/UI-PREVIEW.png"
          ./scripts/Build-Installer.ps1 -PublishDirectory $bundle
          $installer = Join-Path $releaseDirectory "SecureBrowser-$version-setup-win-x64.exe"
          ./scripts/Test-Installer.ps1 -Installer $installer 2>&1 | Tee-Object artifacts/test-results/installer.log
          Copy-Item artifacts/test-results/installer.log $bundle
          $archive = Join-Path $releaseDirectory "$name.zip"
          Compress-Archive -Path $bundle -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "$archive.sha256" -Encoding ascii
          $signature = (Get-AuthenticodeSignature $installer).Status
          @"
          SecureBrowser $version для Windows 11 x64: ZIP с HTTP-прокси и установщик для текущего пользователя.
          .NET включён; нужен WebView2 Evergreen Runtime (проверяется при запуске).
          Проверка подключения перед применением прокси, отдельный сброс разрешений без удаления сессии, сохранение геометрии окна.
          Установка/обновление сохраняют данные; удаление предлагает оставить или удалить локальные профили.
          Пройдены тесты ядра, JavaScript, нативного WebView2 и установщика. Полная матрица и ручные пункты: ACCEPTANCE.md.
          Прокси использует экспериментальный флаг WebView2; системный DNS/UDP и вся пользовательская сеть не сертифицированы.
          Подпись установщика: $signature. При NotSigned сертификат подписи не предоставлен.
          ZIP SHA-256: $hash
          "@ | Set-Content (Join-Path $releaseDirectory 'release-notes.md') -Encoding utf8
      - name: Publish verified release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $notes = 'artifacts/release/release-notes.md'
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" | ConvertFrom-Json
          if (!($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --title "SecureBrowser $env:RELEASE_TAG — Windows x64" --notes-file $notes
          }
          $assets = @(Get-ChildItem artifacts/release -File | Where-Object { $_.Extension -in '.zip','.exe','.sha256' } | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --notes-file $notes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-release-${{ inputs.tag || github.ref_name }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.exe
            artifacts/release/*.sha256
            artifacts/test-results
