          Проверка обоих файлов, одинаковой даты и атомарная замена; прежняя база сохраняется при ошибке.
          Ручной импорт отключает расписание. Открытым профилям нужен перезапуск для нового пояса.
          В 0.1.34 добавлен импорт Mailfud Legacy GeoIP City (.dat / .dat.gz).
          Скачайте https://mailfud.org/geoip-legacy/GeoIPCity.dat.gz и GeoIPCityv6.dat.gz с той же страницы.
          В настройках выберите «Установить / обновить City базу…» и оба файла сразу: gzip распакуется автоматически.
          Legacy хранит координаты; IANA-пояс ищется по встроенной GeoTimeZone карте без сетевого GeoIP API.
          Для IPv6 нужна IPv6-база; старые MMDB поддерживаются. Реальные IP-базы в архив не включены.
