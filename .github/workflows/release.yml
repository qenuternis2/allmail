          SHA-256 ZIP: $hash
          "@ | Set-Content $notesPath -Encoding utf8
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" | ConvertFrom-Json
          $existing = $releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          if (!$existing) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --title "All Mails $env:RELEASE_TAG — Windows x64, HTTP proxy" --notes-file $notesPath
          }
          gh release upload $env:RELEASE_TAG $archive "$archive.sha256" --repo $env:GITHUB_REPOSITORY --clobber
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --prerelease --notes-file $notesPath
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-release-${{ inputs.tag || github.ref_name }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.sha256
            artifacts/test-results
