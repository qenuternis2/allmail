name: cloudflare-public-compatibility-diagnostics
on:
  workflow_dispatch:
  push:
    branches: [fix/cloudflare-login-compatibility]
    paths:
      - tests/ProtonProfiles.WebView2.Smoke/CloudflareCompatibilityDiagnostics.cs
      - tests/ProtonProfiles.WebView2.Smoke/Program.cs
      - .github/workflows/cloudflare-compatibility.yml
jobs:
  diagnostics:
    runs-on: windows-11-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify Windows 11 ARM64 and install pinned x64 SDK
        shell: pwsh
        run: ./scripts/Initialize-Windows11Runner.ps1
      - name: Update WebView2 Evergreen Runtime
        shell: pwsh
        run: ./scripts/Update-WebView2Runtime.ps1
      - name: Observe anonymous Cloudflare login with the production engine
        shell: pwsh
        env:
          ALLMAIL_CLOUDFLARE_DIAGNOSTICS_ONLY: '1'
          ALLMAIL_MIN_WEBVIEW2_MAJOR: '154'
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          dotnet run --project tests/ProtonProfiles.WebView2.Smoke -c Release 2>&1 | Tee-Object -FilePath artifacts/test-results/cloudflare-compatibility.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-public-compatibility-${{ github.sha }}
          path: artifacts/test-results/cloudflare-*
