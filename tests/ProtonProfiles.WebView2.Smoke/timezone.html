<!doctype html><meta charset="utf-8"><body><script>
function snapshot() {
  return {timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    winter:new Date(Date.UTC(2026,0,15,12)).getTimezoneOffset(),summer:new Date(Date.UTC(2026,6,15,12)).getTimezoneOffset(),
    nativeDate:Date.toString().includes('[native code]'),nativeIntl:Intl.DateTimeFormat.toString().includes('[native code]'),
    webCodecs:Object.fromEntries(['AudioDecoder','VideoDecoder','AudioEncoder','VideoEncoder','AudioData','VideoFrame','EncodedAudioChunk','EncodedVideoChunk'].map(k=>[k,typeof globalThis[k]==='function'])),
    htmlAudioSupport:typeof document==='object'?document.createElement('audio').canPlayType('audio/mpeg'):null,
    nativeCanPlayType:typeof document==='object'?HTMLMediaElement.prototype.canPlayType.toString().includes('[native code]'):null};
}
const main=snapshot(); // First script, before await or frame creation.
async function decodeHtmlAudio() {
  // Locally generated 100 ms PCM WAV, no network or sound output.
  const bytes=new Uint8Array(44+1600),view=new DataView(bytes.buffer);
  for(const [offset,value] of [[0,'RIFF'],[8,'WAVE'],[12,'fmt '],[36,'data']])
    for(let i=0;i<value.length;i++)bytes[offset+i]=value.charCodeAt(i);
  view.setUint32(4,bytes.length-8,true);view.setUint32(16,16,true);
  view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,8000,true);
  view.setUint32(28,16000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);view.setUint32(40,1600,true);
  const audio=document.createElement('audio'),url=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));
  let timer;
  try {
    audio.preload='auto';audio.muted=true;
    await new Promise((resolve,reject)=>{
      audio.onloadeddata=resolve;audio.onerror=()=>reject(Error('HTML WAV decode failed'));
      timer=setTimeout(()=>reject(Error('HTML WAV decode timeout')),5000);audio.src=url;audio.load();
    });
    return {duration:audio.duration,readyState:audio.readyState,nativeLoad:HTMLMediaElement.prototype.load.toString().includes('[native code]')};
  } finally {clearTimeout(timer);audio.removeAttribute('src');audio.load();URL.revokeObjectURL(url);}
}
(async()=>{
  const frames=[],results={};let listener,worker,url;
  try {
    const pending=['same','cross'].map((label,i)=>new Promise(resolve=>{
      const frame=document.createElement('iframe');frames.push(frame);
      const origin=i?'https://allmail-frame.test':'https://allmail-smoke.test';
      const receive=e=>{
        if(e.source===frame.contentWindow&&e.origin===origin&&e.data?.kind==='timezone-startup') {
          removeEventListener('message',receive);results[label]=e.data.observation;resolve();
        }
      };
      frame.cleanup=()=>removeEventListener('message',receive);addEventListener('message',receive);
      frame.src=origin+'/timezone-frame.html';document.body.appendChild(frame);
    }));
    url=URL.createObjectURL(new Blob([snapshot.toString()+';postMessage(snapshot());'],{type:'text/javascript'}));
    worker=new Worker(url);
    const w=new Promise((resolve,reject)=>{worker.onmessage=e=>{results.worker=e.data;resolve();};worker.onerror=reject;});
    const [htmlAudioDecode]=await Promise.all([decodeHtmlAudio(),...pending,w]);
    chrome.webview.postMessage(JSON.stringify({main,...results,htmlAudioDecode}));
  } finally {for(const f of frames){f.cleanup();f.remove();}worker?.terminate();if(url)URL.revokeObjectURL(url);}
})().catch(e=>chrome.webview.postMessage(JSON.stringify({error:String(e)})));
</script>
