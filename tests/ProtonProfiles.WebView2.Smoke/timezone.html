<!doctype html><meta charset="utf-8"><body><script>
function snapshot() {
  return {timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    winter:new Date(Date.UTC(2026,0,15,12)).getTimezoneOffset(),summer:new Date(Date.UTC(2026,6,15,12)).getTimezoneOffset(),
    nativeDate:Date.toString().includes('[native code]'),nativeIntl:Intl.DateTimeFormat.toString().includes('[native code]')};
}
const main=snapshot(); // First script, before await or frame creation.
(async()=>{
  const frames=[],results={};let listener,worker,url;
  try {
    const pending=['same','cross'].map((label,i)=>new Promise(resolve=>{
      const frame=document.createElement('iframe');frames.push(frame);
      const origin=i?'https://allmail-frame.test':'https://allmail-smoke.test';
      const receive=e=>{
        if(e.source===frame.contentWindow&&e.origin===origin&&e.data?.kind==='timezone-startup') {
          removeEventListener('message',receive);results[label]=e.data.observation;resolve();
        }
      };
      frame.cleanup=()=>removeEventListener('message',receive);addEventListener('message',receive);
      frame.src=origin+'/timezone-frame.html';document.body.appendChild(frame);
    }));
    url=URL.createObjectURL(new Blob([snapshot.toString()+';postMessage(snapshot());'],{type:'text/javascript'}));
    worker=new Worker(url);
    const w=new Promise((resolve,reject)=>{worker.onmessage=e=>{results.worker=e.data;resolve();};worker.onerror=reject;});
    await Promise.all([...pending,w]);
    chrome.webview.postMessage(JSON.stringify({main,...results}));
  } finally {for(const f of frames){f.cleanup();f.remove();}worker?.terminate();if(url)URL.revokeObjectURL(url);}
})().catch(e=>chrome.webview.postMessage(JSON.stringify({error:String(e)})));
</script>
