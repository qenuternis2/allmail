<!doctype html><meta charset="utf-8"><script>
"use strict";
// Capture native Date and Intl in the very first script, before asynchronous work.
const observation={timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,
  winter:new Date(Date.UTC(2026,0,15,12)).getTimezoneOffset(),summer:new Date(Date.UTC(2026,6,15,12)).getTimezoneOffset(),
  nativeDate:Date.toString().includes('[native code]'),nativeIntl:Intl.DateTimeFormat.toString().includes('[native code]'),
  webCodecs:Object.fromEntries(['AudioDecoder','VideoDecoder','AudioEncoder','VideoEncoder','AudioData','VideoFrame','EncodedAudioChunk','EncodedVideoChunk'].map(k=>[k,typeof globalThis[k]==='function'])),
  htmlAudioSupport:document.createElement('audio').canPlayType('audio/mpeg'),
  nativeCanPlayType:HTMLMediaElement.prototype.canPlayType.toString().includes('[native code]')};
parent.postMessage({kind:'timezone-startup',observation},'https://allmail-smoke.test');
</script>
